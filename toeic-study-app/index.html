<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC 암기">
<meta name="theme-color" content="#f7f7f5">
<title>TOEIC 연상암기 180</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#171717;--muted:#6f6f6f;--line:#e7e5e1;--accent:#1f6feb;--p1:#fff0df;--p2:#edf7ef;--p3:#f2efff;--warn:#fff7db;--ok:#eaf7ee;--mid:#fff3e8}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--card:#1a1c1f;--text:#f4f4f4;--muted:#aaa;--line:#303238;--accent:#79a8ff;--p1:#382819;--p2:#1d3124;--p3:#29233d;--warn:#342e19;--ok:#193022;--mid:#34251d}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;line-height:1.55;padding-bottom:calc(34px + env(safe-area-inset-bottom))}.app{max-width:980px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}header{padding:7px 2px 13px}h1{font-size:25px;line-height:1.2;margin:4px 0 7px;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted)}.panel{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0 11px;border-bottom:1px solid var(--line)}.searchrow{display:flex;gap:8px}input[type=search]{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:13px;font-size:16px;background:var(--card);color:var(--text);outline:0}button,select{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:650;cursor:pointer}button:active{transform:scale(.985)}.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;padding:8px 11px;border-radius:999px;font-size:13px}.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;padding-top:8px}.progress{font-size:13px;color:var(--muted);margin-top:9px}.progressbar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:5px}.progressbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}#cards{display:grid;gap:11px;padding-top:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:0 1px 0 rgba(0,0,0,.02)}.top{display:flex;align-items:flex-start;gap:8px}.word{font-size:22px;font-weight:800;letter-spacing:-.25px;flex:1;word-break:break-word}.speak{padding:7px 9px;min-width:42px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}.badge{font-size:11px;font-weight:750;padding:4px 8px;border-radius:999px;border:1px solid var(--line)}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}.public{background:var(--warn)}.block{padding:10px 11px;border-radius:12px;margin-top:8px;background:var(--bg)}.label{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:2px}.meaning{font-weight:750}.mnemonic{font-size:15px}.phrase{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}.note{font-size:13px;color:var(--muted);margin-top:7px}.masked{cursor:pointer;user-select:none}.masked .secret{filter:blur(7px);opacity:.45}.masked:after{content:"탭해서 보기";display:block;color:var(--accent);font-size:12px;font-weight:700;margin-top:3px}.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sources a{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.status button{font-size:12px;padding:8px 4px}.status button.on[data-s=maybe]{background:var(--mid);border-color:#d9a56f}.status button.on[data-s=done]{background:var(--ok);border-color:#70ad7f}#tableWrap{display:none;overflow-x:auto;padding-top:15px}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:780px}th,td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--card)}td{font-size:14px}tr:last-child td{border-bottom:0}.tword{font-weight:800;font-size:16px}.small{font-size:12px;color:var(--muted)}.empty{padding:40px 10px;text-align:center;color:var(--muted)}dialog{width:min(92vw,520px);border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--text);padding:0;box-shadow:0 20px 70px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}.modal{padding:20px}.modal .word{font-size:30px}.modalActions{display:flex;gap:8px;margin-top:15px}.modalActions button{flex:1}.tip{margin:3px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--card);font-size:12px;color:var(--muted)}.footerNote{font-size:12px;color:var(--muted);padding:18px 3px 0}@media(min-width:760px){#cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header><h1>TOEIC 연상암기 180</h1><div class="sub">단어 → 암기 단서 → 뜻 · 진도는 이 기기의 Safari에 저장돼요.</div></header>
<div class="tip">📱 아이폰/아이패드: Safari의 <b>공유</b> → <b>홈 화면에 추가</b>를 누르면 앱 아이콘처럼 사용할 수 있어요.</div>
<section class="panel">
<div class="searchrow"><input id="q" type="search" placeholder="단어 · 뜻 · 연상법 검색" autocomplete="off"><button id="randomBtn" title="랜덤 한 장">🎲</button></div>
<div class="chips" id="priorityChips"><button class="chip active" data-priority="all">전체</button><button class="chip" data-priority="1">🔥 1순위</button><button class="chip" data-priority="2">⭐ 2순위</button><button class="chip" data-priority="3">🌱 3순위</button><button class="chip" data-priority="public">📚 공개 암기법</button></div>
<div class="toolbar"><select id="statusFilter"><option value="all">진도: 전체</option><option value="new">아직만</option><option value="maybe">애매만</option><option value="done">외움만</option></select><button id="studyBtn">🙈 암기 모드</button><button id="shuffleBtn">🔀 섞기</button><button id="viewBtn">▦ 표로 보기</button><button id="resetBtn">↺ 초기화</button></div>
<div class="progress" id="progressText"></div><div class="progressbar"><i id="progressBar"></i></div>
</section>
<main><div id="cards"></div><div id="tableWrap"><table><thead><tr><th>단어</th><th>암기 단서</th><th>연결할 뜻</th><th>TOEIC 표현</th><th>진도</th></tr></thead><tbody id="tbody"></tbody></table></div></main>
<div class="footerNote">※ 말장난은 실제 발음·어원이 아니라 기억용 장치입니다. “공개/응용”은 출처가 표시된 항목입니다.</div>
</div>
<dialog id="randomDialog"><div class="modal"><div class="badges" id="rBadges"></div><div class="top"><div class="word" id="rWord"></div><button class="speak" id="rSpeak">🔊</button></div><div class="block masked" id="rMeaning"><div class="label">연결할 뜻</div><div class="secret meaning"></div></div><div class="block masked" id="rMnemonic"><div class="label">암기 단서</div><div class="secret mnemonic"></div></div><div class="block"><div class="label">TOEIC 표현</div><div class="phrase" id="rPhrase"></div></div><div class="modalActions"><button id="rNext">다음 🎲</button><button id="rClose">닫기</button></div></div></dialog>
<script>window.TOEIC_DATA=[];</script>
<script src="data-1.js"></script>
<script src="data-2.js"></script>
<script src="data-3.js"></script>
<script src="data-4.js"></script>
<script>
const DATA=window.TOEIC_DATA,STORE="toeic_mnemonic_progress_v2";let progress={};try{progress=JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){}let filterPriority="all",statusFilter="all",studyMode=false,view="cards",shuffled=false,order=DATA.map((_,i)=>i);const $=s=>document.querySelector(s),cards=$("#cards"),tbody=$("#tbody"),tableWrap=$("#tableWrap");function keyOf(i){return`p${i.priority}-${i.num}-${i.word}`}function statusOf(i){return progress[keyOf(i)]||"new"}function save(){localStorage.setItem(STORE,JSON.stringify(progress));updateProgress()}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.86;speechSynthesis.speak(u)}function sourceLinks(i){return i.sources?.length?`<div class="sources">${i.sources.map((u,n)=>`<a href="${esc(u)}" target="_blank" rel="noopener">출처${i.sources.length>1?" "+(n+1):""} ↗</a>`).join("")}</div>`:""}function badgeHTML(i){return`<span class="badge p${i.priority}">${i.priority}순위</span>`+(i.kind==="공개/응용"?`<span class="badge public">📚 공개/응용</span>`:`<span class="badge">직접 연상</span>`)}function filtered(){const q=$("#q").value.trim().toLowerCase();return order.map(i=>DATA[i]).filter(i=>{const p=filterPriority==="all"||String(i.priority)===filterPriority||filterPriority==="public"&&i.kind==="공개/응용",s=statusFilter==="all"||statusOf(i)===statusFilter,h=[i.word,i.meaning,i.mnemonic,i.collocation,i.note].join(" ").toLowerCase();return p&&s&&(!q||h.includes(q))})}function statusButtons(i){const s=statusOf(i);return`<div class="status"><button data-action="status" data-key="${esc(keyOf(i))}" data-s="new" class="${s==="new"?"on":""}">☐ 아직</button><button data-action="status" data-key="${esc(keyOf(i))}" data-s="maybe" class="${s==="maybe"?"on":""}">△ 애매</button><button data-action="status" data-key="${esc(keyOf(i))}" data-s="done" class="${s==="done"?"on":""}">✓ 외움</button></div>`}function cardHTML(i){const m=studyMode?" masked":"";return`<article class="card"><div class="top"><div class="word">${esc(i.word)}</div><button class="speak" data-action="speak" data-word="${esc(i.word)}">🔊</button></div><div class="badges">${badgeHTML(i)}</div><div class="block${m}" data-action="${studyMode?"reveal":""}"><div class="label">연결할 뜻</div><div class="secret meaning">${esc(i.meaning)}</div></div><div class="block${m}" data-action="${studyMode?"reveal":""}"><div class="label">🧠 암기 단서</div><div class="secret mnemonic">${esc(i.mnemonic)}</div></div>${i.collocation?`<div class="block"><div class="label">TOEIC 표현</div><div class="phrase">${esc(i.collocation)}</div></div>`:""}${i.note?`<div class="note">⚠ ${esc(i.note)}</div>`:""}${sourceLinks(i)}${statusButtons(i)}</article>`}function tableRow(i){const s=statusOf(i),l=s==="done"?"✓ 외움":s==="maybe"?"△ 애매":"☐ 아직";return`<tr><td><div class="tword">${esc(i.word)}</div><div class="small">${i.priority}순위 · ${esc(i.kind)}</div></td><td>${esc(i.mnemonic)}${sourceLinks(i)}</td><td><b>${esc(i.meaning)}</b>${i.note?`<div class="small">⚠ ${esc(i.note)}</div>`:""}</td><td><code>${esc(i.collocation)}</code></td><td><button data-action="cycle" data-key="${esc(keyOf(i))}" data-current="${s}">${l}</button></td></tr>`}function render(){const l=filtered();if(view==="cards"){cards.style.display="grid";tableWrap.style.display="none";cards.innerHTML=l.length?l.map(cardHTML).join(""):`<div class="empty">조건에 맞는 단어가 없어요.</div>`}else{cards.style.display="none";tableWrap.style.display="block";tbody.innerHTML=l.length?l.map(tableRow).join(""):`<tr><td colspan="5" class="empty">조건에 맞는 단어가 없어요.</td></tr>`}updateProgress()}function updateProgress(){const d=DATA.filter(x=>statusOf(x)==="done").length,m=DATA.filter(x=>statusOf(x)==="maybe").length;$("#progressText").textContent=`외움 ${d} / ${DATA.length} · 애매 ${m} · 현재 표시 ${filtered().length}개`;$("#progressBar").style.width=`${d/DATA.length*100}%`}document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="speak")speak(b.dataset.word);if(a==="reveal")b.classList.remove("masked");if(a==="status"){progress[b.dataset.key]=b.dataset.s;save();render()}if(a==="cycle"){const n=b.dataset.current==="new"?"maybe":b.dataset.current==="maybe"?"done":"new";progress[b.dataset.key]=n;save();render()}});$("#q").addEventListener("input",render);$("#statusFilter").addEventListener("change",e=>{statusFilter=e.target.value;render()});$("#priorityChips").addEventListener("click",e=>{const b=e.target.closest("[data-priority]");if(!b)return;filterPriority=b.dataset.priority;document.querySelectorAll("#priorityChips .chip").forEach(x=>x.classList.toggle("active",x===b));render()});$("#studyBtn").addEventListener("click",()=>{studyMode=!studyMode;$("#studyBtn").textContent=studyMode?"👀 정답 보이기":"🙈 암기 모드";render()});$("#shuffleBtn").addEventListener("click",()=>{shuffled=!shuffled;order=DATA.map((_,i)=>i);if(shuffled){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}$("#shuffleBtn").textContent="↩ 원래 순서"}else $("#shuffleBtn").textContent="🔀 섞기";render()});$("#viewBtn").addEventListener("click",()=>{view=view==="cards"?"table":"cards";$("#viewBtn").textContent=view==="cards"?"▦ 표로 보기":"▤ 카드로 보기";render()});$("#resetBtn").addEventListener("click",()=>{if(confirm("저장된 암기 진도를 모두 초기화할까요?")){progress={};save();render()}});const dlg=$("#randomDialog");function openRandom(){const l=filtered();if(!l.length)return;const i=l[Math.floor(Math.random()*l.length)];$("#rBadges").innerHTML=badgeHTML(i);$("#rWord").textContent=i.word;$("#rMeaning .meaning").textContent=i.meaning;$("#rMnemonic .mnemonic").textContent=i.mnemonic;$("#rPhrase").textContent=i.collocation||"—";$("#rMeaning").classList.add("masked");$("#rMnemonic").classList.add("masked");$("#rSpeak").onclick=()=>speak(i.word);if(!dlg.open)dlg.showModal()}$("#randomBtn").addEventListener("click",openRandom);$("#rNext").addEventListener("click",openRandom);$("#rClose").addEventListener("click",()=>dlg.close());$("#rMeaning").addEventListener("click",()=>$("#rMeaning").classList.remove("masked"));$("#rMnemonic").addEventListener("click",()=>$("#rMnemonic").classList.remove("masked"));render();
</script>
</body></html>
